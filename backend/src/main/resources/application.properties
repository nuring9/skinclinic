spring.application.name=skinclinic
server.port=8080

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/skinclinic?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

logging.level.org.hibernate.type.descriptor.sql=trace

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

gemini.api-key=${GEMINI_API_KEY:}
gemini.base-url=https://generativelanguage.googleapis.com
gemini.model=gemini-2.5-flash

notification.sms.provider=solapi
notification.sms.solapi.api-key=${SOLAPI_API_KEY:}
notification.sms.solapi.api-secret=${SOLAPI_API_SECRET:}
notification.sms.solapi.sender-number=${SOLAPI_SENDER_NUMBER:}
notification.sms.solapi.domain=${SOLAPI_DOMAIN:https://api.solapi.com}

notification.kakao.provider=rest
notification.kakao.rest-api-key=${KAKAO_REST_API_KEY:}
notification.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
notification.kakao.message-api-base-url=${KAKAO_MESSAGE_API_BASE_URL:https://kapi.kakao.com}
notification.kakao.auth-api-base-url=${KAKAO_AUTH_API_BASE_URL:https://kauth.kakao.com}
notification.kakao.web-url=${KAKAO_WEB_URL:http://localhost:5173/mypage/notifications}
notification.kakao.mobile-web-url=${KAKAO_MOBILE_WEB_URL:http://localhost:5173/mypage/notifications}
notification.kakao.button-title=${KAKAO_BUTTON_TITLE:알림 확인하기}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

kakao.client-id=${KAKAO_OAUTH_CLIENT_ID:}
kakao.client-secret=${KAKAO_OAUTH_CLIENT_SECRET:}
